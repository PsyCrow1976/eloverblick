services:
  web:
    build: .
    container_name: eloverblick
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]"
      net.unraid.docker.description: "ElOverblik usage viewer"
